<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가톨릭 달력 - 일정 공유 (목업 A: 미니멀 카드형)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #EDEBE4;
    font-family: 'Pretendard', -apple-system, system-ui, sans-serif;
    color: #3A3630;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .stripe {
    height: 6px;
    width: 100%;
    background: linear-gradient(90deg, #2E7D32, #B59410, #C62828, #6A1B9A);
  }
  .wrap {
    flex: 1;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }
  .card {
    background: #FFFFFF;
    border-radius: 28px;
    max-width: 380px;
    width: 100%;
    padding: 36px 28px 32px;
    text-align: center;
    box-shadow: 0 12px 40px rgba(58, 54, 48, 0.12), 0 2px 8px rgba(58, 54, 48, 0.06);
  }
  .icon {
    width: 88px;
    height: 88px;
    border-radius: 22px;
    box-shadow: 0 6px 18px rgba(58, 54, 48, 0.18);
    margin-bottom: 18px;
  }
  .dots { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot.g { background: #2E7D32; }
  .dot.y { background: #B59410; }
  .dot.r { background: #C62828; }
  .dot.v { background: #6A1B9A; }
  h1 {
    font-family: 'Song Myung', serif;
    font-size: 26px;
    margin: 0 0 10px;
    letter-spacing: 0.02em;
  }
  p.body-text {
    font-size: 15px;
    line-height: 1.55;
    color: #6B655C;
    margin: 0 0 26px;
  }
  .cta {
    display: block;
    width: 100%;
    padding: 15px 0;
    border-radius: 999px;
    background: #2E7D32;
    color: #fff;
    font-weight: 700;
    font-size: 16px;
    text-decoration: none;
    box-shadow: 0 8px 20px rgba(46, 125, 50, 0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .cta:active { transform: scale(0.97); box-shadow: 0 4px 10px rgba(46, 125, 50, 0.25); }
  .hint {
    font-size: 13px;
    color: #9A948A;
    margin-top: 18px;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="stripe"></div>
  <div class="wrap">
    <div class="card">
      <img class="icon" src="../../assets/icon/app_icon.png" alt="가톨릭 달력">
      <div class="dots">
        <span class="dot g"></span><span class="dot y"></span><span class="dot r"></span><span class="dot v"></span>
      </div>
      <h1>가톨릭 달력</h1>
      <p class="body-text">공유된 일정을 확인하려면<br>가톨릭 달력 앱이 필요합니다.</p>
      <a class="cta" href="#">앱에서 열기</a>
      <p class="hint">앱이 없으신가요? 설치 후<br>이 링크를 다시 눌러 주세요.</p>
    </div>
  </div>
</body>
</html>
