<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가톨릭 달력 - 일정 공유 (목업 B: 브랜드 히어로형, 채택)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 50% 0%, #F6F3EC 0%, #EDEBE4 55%, #E7E3D8 100%);
    font-family: 'Pretendard', -apple-system, system-ui, sans-serif;
    color: #3A3630;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wrap {
    max-width: 420px;
    width: 100%;
    padding: 56px 28px 40px;
    text-align: center;
  }
  .icon-shell {
    display: inline-flex;
    padding: 14px;
    border-radius: 32px;
    background: radial-gradient(circle, rgba(46,125,50,0.16), rgba(46,125,50,0) 70%);
    margin-bottom: 8px;
  }
  .icon {
    width: 128px;
    height: 128px;
    border-radius: 28px;
    box-shadow: 0 16px 36px rgba(58, 54, 48, 0.22);
  }
  h1 {
    font-family: 'Song Myung', serif;
    font-size: 32px;
    margin: 22px 0 8px;
  }
  p.tagline {
    font-size: 15px;
    color: #857F73;
    margin: 0 0 26px;
  }
  .divider { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 26px 0; }
  .divider .dot { width: 10px; height: 10px; border-radius: 50%; }
  .divider .line { height: 1px; width: 32px; background: #D8D3C6; }
  .g { background: #2E7D32; } .y { background: #B59410; } .r { background: #C62828; } .v { background: #6A1B9A; }
  p.body-text {
    font-size: 16px;
    line-height: 1.6;
    color: #55504A;
    margin: 0 0 30px;
  }
  .cta {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 17px 40px;
    border-radius: 999px;
    background: #2E7D32;
    color: #fff;
    font-weight: 700;
    font-size: 17px;
    text-decoration: none;
    box-shadow: 0 10px 28px rgba(46, 125, 50, 0.32);
    transition: transform 0.15s ease;
  }
  .cta:active { transform: scale(0.96); }
  .hint {
    font-size: 13px;
    color: #9A948A;
    margin-top: 22px;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="icon-shell">
      <img class="icon" src="../../assets/icon/app_icon.png" alt="가톨릭 달력">
    </div>
    <h1>가톨릭 달력</h1>
    <p class="tagline">전례력과 함께하는 나의 하루</p>
    <div class="divider">
      <span class="line"></span>
      <span class="dot g"></span><span class="dot y"></span><span class="dot r"></span><span class="dot v"></span>
      <span class="line"></span>
    </div>
    <p class="body-text">공유된 일정을 확인하려면<br>가톨릭 달력 앱이 필요합니다.</p>
    <a class="cta" href="#">앱에서 열기 →</a>
    <p class="hint">앱이 없으신가요? 설치 후 이 링크를 다시 눌러 주세요.</p>
  </div>
</body>
</html>
